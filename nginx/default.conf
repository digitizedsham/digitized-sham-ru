
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Главная страница
    location = / {
        try_files /index.html =404;
    }

    # Страница "Ссылки"
    location = /links {
        try_files /links.html =404;
    }

    # CSS-файлы
    location /css/ {
        try_files $uri =404;
        default_type text/css;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Все остальные URL
    location / {
        return 404;
    }
}
