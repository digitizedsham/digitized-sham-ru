services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy_server
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Для работы HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./html:/usr/share/caddy # Пробрасываем папку с вашим сайтом
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: